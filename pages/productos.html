<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos</title>

    <link rel="stylesheet" href="../src/css/productos.css">
</head>

<body>

    <div class="app-layout">

        <aside class="sidebar">
            <div class="sidebar-titulo">
                <h2>Sistema</h2>
            </div>

            <nav class="sidebar-menu">
                <a href="dashboard.html" class="sidebar-link">
                    <span class="sidebar-icono">⌂</span>
                    <span>Dashboard</span>
                </a>

                <a href="index.html" class="sidebar-link">
                    <span class="sidebar-icono"></span>
                    <span>Clientes</span>
                </a>

                <a href="productos.html" class="sidebar-link activo">
                    <span class="sidebar-icono"></span>
                    <span>Productos</span>
                </a>

                <a href="proveedores.html" class="sidebar-link">
                    <span class="sidebar-icono"></span>
                    <span>Proveedores</span>
                </a>
            </nav>
        </aside>

        <main class="contenido-principal">
<div class="container">

        <h2>Gestión de Productos</h2>

        <button id="btn-modo-oscuro" class="btn-toggle-theme" type="button">
            🌙 Modo Oscuro
        </button>

        <form id="form-producto">

            <input type="hidden" id="producto-id">

            <div class="form-group">
                <label for="producto-nombre">Nombre del producto:</label>
                <input type="text" id="producto-nombre" required>
            </div>

            <div class="form-group">
                <label for="producto-categoria">Categoría:</label>
                <input type="text" id="producto-categoria" required>
            </div>

            <div class="form-group">
                <label for="producto-precio">Precio:</label>
                <input type="number" id="producto-precio" min="0.01" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="producto-stock">Stock:</label>
                <input type="number" id="producto-stock" min="0" step="1" required>
            </div>

            <div class="form-group">
                <label for="producto-proveedor">Proveedor:</label>

                <select id="producto-proveedor" required>
                    <option value="">Seleccione un proveedor</option>
                </select>
            </div>

            <p id="mensaje-producto" class="mensaje-error"></p>

            <div class="form-actions">
                <button type="submit" id="btn-guardar-producto" class="btn-primary">
                    Guardar Producto
                </button>

                <button type="button" id="btn-cancelar-producto" class="btn-secondary" style="display:none;">
                    Cancelar
                </button>
            </div>

        </form>

        <hr>

        <h3>Lista de Productos Registrados</h3>

        <div class="form-group" style="margin-top:20px;">
            <label for="buscador-producto">Buscar Producto:</label>
            <input
                type="text"
                id="buscador-producto"
                placeholder="Escribe nombre, categoría o proveedor..."
            >
        </div>

        <div class="tabla-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Proveedor</th>
                        <th>Acciones</th>
                    </tr>
                </thead>

                <tbody id="tabla-productos-body"></tbody>
            </table>
        </div>

    </div>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../src/js/productos.js"></script>
</body>
</html>
